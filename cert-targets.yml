# ═══════════════════════════════════════════════════════════════════
# cert-targets.yml — Certificate distribution configuration
#
# Defines where each certificate is delivered after issuance or renewal.
# Multiple targets per domain are supported.
#
# Mounted into the container at /data/cert-targets.yml (read-only).
# ═══════════════════════════════════════════════════════════════════
#
# Supported types:
#   ssh         — Transfer via SCP + optional reload command.
#                 Works for Traefik (file provider + watch: true),
#                 nginx, Apache, and any SSH-accessible system.
#
#   windows-ssh — For Windows hosts that run an SSH server (Win32-OpenSSH).
#                 Transfers certificate.pfx via SCP and then imports it
#                 into Cert:\LocalMachine\My on the remote host — no
#                 manual Import-PfxCertificate step needed. The PFX
#                 password (freshly random per issue/renewal, generated by
#                 renew-hook.sh — not from .env) is sent over the SSH
#                 stdin channel, never as a command-line argument.
#                 reload_cmd runs afterward (e.g. to rebind IIS).
#
#   sftp-drop   — Place PFX in an SFTP drop directory.
#                 Windows servers retrieve the file via SFTP (port 2222).
#                 Add users with: ./scripts/host/sftp-add-user.sh
#                 Use this instead of windows-ssh when the Windows host
#                 has no SSH server, or you want the import to stay a
#                 manual/scripted step on the Windows side.
#
#   proxmox     — Install certificates directly into Proxmox VE via SSH.
#                 Writes to /etc/pve/local/ (pmxcfs) and restarts pveproxy.
#                 No remote_cert_dir or reload_cmd required.
#
#   esxi        — Install certificates directly into VMware ESXi via SSH.
#                 Writes to /etc/vmware/ssl/rui.crt + rui.key and restarts
#                 hostd (+ vpxa). No remote_cert_dir or reload_cmd required.
#                 Requires SSH enabled on the host.
#
#
# ── Traefik note ────────────────────────────────────────────────────
# Traefik must have a file provider with watch: true pointing to the
# remote_cert_dir. It will then detect new certificates automatically
# without a restart. Example configuration on the target host:
#
#   traefik.yml (static config):
#     providers:
#       file:
#         directory: /dynamic
#         watch: true
#
#   /dynamic/tls.yml (dynamic config):
#     tls:
#       certificates:
#         - certFile: /certs/example.com/fullchain.pem
#           keyFile:  /certs/example.com/privkey.pem
#
#   The directories must be mounted into the Traefik container:
#     volumes:
#       - /opt/traefik/certs:/certs
#       - /opt/traefik/dynamic:/dynamic

targets:

  # ── example.com ───────────────────────────────────────────────────
  # The key must match $CERTDOMAIN as set by acme.sh (base domain, e.g. "example.com")
  example.com:

    # SSH transfer to a Traefik host
    - type: ssh
      host: example.com
      user: root
      port: 22
      key: /data/ssh/id_ed25519
      # Host-side path (not the container path inside Traefik).
      # Certificates are placed under: remote_cert_dir/example.com/
      remote_cert_dir: /opt/traefik/certs
      # reload_cmd is optional.
      # Traefik with file provider + watch: true does not require a reload.
      # Examples:
      #   reload_cmd: "docker kill --signal=SIGUSR1 traefik"
      #   reload_cmd: "systemctl reload nginx"
      #   reload_cmd: "apachectl graceful"

  # ── Additional domains and target types (commented out examples) ────
  # other-domain.com:
  #
  #   # SSH transfer (nginx, Apache, Traefik, ...)
  #   - type: ssh
  #     host: server2.example.com
  #     user: deploy
  #     port: 22
  #     key: /data/ssh/id_ed25519
  #     remote_cert_dir: /etc/nginx/certs
  #     reload_cmd: "systemctl reload nginx"
  #
  #   # Proxmox VE — installs to /etc/pve/local/ and restarts pveproxy
  #   - type: proxmox
  #     host: proxmox.example.com
  #     user: root
  #     port: 22
  #     key: /data/ssh/id_ed25519
  #
  #   # Windows with an SSH server (Win32-OpenSSH) — SCP + automatic
  #   # import into Cert:\LocalMachine\My. "user" needs local admin
  #   # rights on the target (required to write to LocalMachine\My).
  #   - type: windows-ssh
  #     host: win-iis-1.example.com
  #     user: Administrator
  #     port: 22
  #     key: /data/ssh/id_ed25519
  #     remote_cert_dir: C:\certs
  #     # legacy_pfx is optional (default: false). Set to true only for older
  #     # Windows hosts (e.g. Server 2016) whose CryptoAPI can't import the
  #     # modern AES-256+SHA-256 PFX encoding — Import-PfxCertificate fails
  #     # there with a misleading "wrong password" error. When true, the
  #     # weaker (but still adequate for a short-lived, immediately-deleted
  #     # transfer file) RC2/3DES-SHA1 PFX variant is sent instead. Leave
  #     # unset/false on newer hosts to keep the stronger encryption.
  #     legacy_pfx: true
  #     # reload_script (optional) is a local path INSIDE the container to a
  #     # .ps1 file, e.g. /scripts/remote/reload-iis.ps1 (baked into the image
  #     # from scripts/container/remote/). It's copied to remote_cert_dir on
  #     # every deploy, so the Windows host never needs a manual one-time file
  #     # copy and always has the current version — no drift between hosts.
  #     reload_script: /scripts/remote/reload-iis.ps1
  #     # reload_cmd is optional, runs after the import, e.g. to rebind
  #     # the cert to an IIS site (replace <thumbprint-source> as needed).
  #     # {{DOMAIN}} is replaced with the actual domain (the "targets:" key
  #     # above) before execution, so the domain isn't hardcoded twice:
  #     #   reload_cmd: 'powershell -File C:\certs\reload-iis.ps1 -Domain {{DOMAIN}}'
  #     #   reload_cmd: "powershell -Command \"Get-ChildItem Cert:\\LocalMachine\\My | Sort-Object NotBefore -Descending | Select-Object -First 1 | ForEach-Object { netsh http add sslcert ipport=0.0.0.0:443 certhash=$($_.Thumbprint) appid='{00000000-0000-0000-0000-000000000000}' }\""
  #   # SFTP drop for Windows/IIS
  #   # Windows servers retrieve: /certs/<domain>/certificate.pfx
  #   # Add users with: ./scripts/host/sftp-add-user.sh <username> <public-key>
  #   - type: sftp-drop
  #     sftp_users:
  #       - win-iis-1
  #       - win-iis-2
  #
  #   # VMware ESXi Host Client — installs to /etc/vmware/ssl/rui.crt +
  #   # rui.key and restarts hostd (+ vpxa). Enable SSH on the host first
  #   # (Host Client → Actions → Services → Enable Secure Shell (SSH)).
  #   - type: esxi
  #     host: esxi-host1.example.com
  #     user: root
  #     port: 22
  #     key: /data/ssh/id_ed25519
