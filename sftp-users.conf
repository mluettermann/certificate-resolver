# ═══════════════════════════════════════════════════════════════
# sftp-users.conf — SFTP users for Windows/IIS hosts
#
# Format: username::uid:gid:chroot-subdir
#   - Empty password → SSH key authentication only (no password login)
#   - chroot-subdir  → subdirectory accessible to the user
#                      (relative to /home/<username>)
#
# Add a new user:
#   ./scripts/host/sftp-add-user.sh <username> <path-to-public-key>
#   docker compose restart sftp
#
# Examples (commented out — use sftp-add-user.sh to create):
# win-iis-1::1001:100:certs
# win-iis-2::1002:100:certs
# ═══════════════════════════════════════════════════════════════
