; ═══════════════════════════════════════════════════════════════
; supervisord.conf
;
; Logging concept:
;   - STDOUT (docker logs) shows STATUS only: supervisord starting/
;     stopping programs and program crashes.
;   - Detailed program output goes to ROTATING files under /logs:
;       acme-dns   → /logs/acme-dns.log     (+ .err.log)
;       renewal    → /logs/renewal.log      (+ .err.log)
;     Rotation is handled natively by supervisord (maxbytes + backups).
;   - The renewal daemon additionally keeps a structured log via
;     notify.sh at /logs/certificate-resolver.log (self-rotating).
;   /logs is a single host folder mounted into both containers.
; ═══════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

; ─── acme-dns: minimal DNS server for ACME challenges ──────────
; Verbose DNS output → rotating file (not docker stdout).
[program:acme-dns]
command=/usr/local/bin/acme-dns -c /etc/acme-dns/config.cfg
stdout_logfile=/logs/acme-dns.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/logs/acme-dns.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
autostart=true
autorestart=true
priority=10

; ─── Renewal daemon: daily certificate check ─────────────────
; Detailed output (incl. acme.sh) → rotating file. notify.sh also
; keeps /data/certificate-resolver.log (see CR_LOG_FILE).
[program:acme-renewal]
command=/scripts/renewal-daemon.sh
stdout_logfile=/logs/renewal.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/logs/renewal.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=CR_LOG_LEVEL="%(ENV_CR_LOG_LEVEL)s",CR_LOG_FILE="%(ENV_CR_LOG_FILE)s"
autostart=true
autorestart=true
priority=20
